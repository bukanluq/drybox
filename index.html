<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensor Monitor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
}

.page{
    display:none;
    min-height:100vh;
    justify-content:flex-start;
    align-items:center;
    flex-direction:column;
    padding:40px 20px 100px;
    position:relative;
}

.active{
    display:flex;
}

h1{
    margin-bottom:30px;
    color:#fff;
    font-size:32px;
    letter-spacing:2px;
    text-align:center;
}

/* WHITE SQUARE BUTTONS */
button{
    width:260px;
    padding:16px;
    margin:10px;
    border:2px solid #fff;
    border-radius:0;
    background:#fff;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#000;
    color:#fff;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.dangerButton{
    border-color:#d9483b;
    color:#d9483b;
}

.dangerButton:hover{
    background:#d9483b;
    color:#fff;
}

/* INPUT BOXES */
input[type="text"], input[type="password"]{
    width:280px;
    padding:15px;
    margin:10px;
    border:2px solid #fff;
    border-radius:0;
    background:#000;
    color:#fff;
    font-size:18px;
}

input::placeholder{
    color:#888;
}

/* FILE INPUT (Add Photo) styled as a button */
.photo-input-wrap{
    width:280px;
    margin:10px;
}

.photo-input-wrap input[type="file"]{
    display:none;
}

.photo-btn{
    width:280px;
    padding:16px;
    border:2px solid #fff;
    background:transparent;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    display:block;
    transition:.2s;
}

.photo-btn:hover{
    background:#fff;
    color:#000;
}

/* SENSOR DISPLAY CARD */
.card{
    background:#000;
    border:2px solid #fff;
    border-radius:0;
    width:320px;
    padding:20px;
    margin-bottom:20px;
}

.data{
    font-size:24px;
    margin:10px 0;
    color:#fff;
    word-break:break-word;
}

.small{
    font-size:15px;
    color:#aaa;
}

hr{
    border:1px solid #fff;
    margin:15px 0;
    opacity:.5;
}

#photoPreview{
    width:180px;
    height:180px;
    object-fit:cover;
    border:2px solid #fff;
    margin:15px 0;
    display:none;
}

#cardPhoto{
    width:100%;
    max-width:280px;
    aspect-ratio:1/1;
    object-fit:cover;
    border:2px solid #fff;
    margin-bottom:15px;
    display:none;
}

.noPhoto{
    width:100%;
    max-width:280px;
    aspect-ratio:1/1;
    border:2px dashed #555;
    color:#555;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
    margin-bottom:15px;
    text-align:center;
}

.itemId{
    display:inline-block;
    border:2px solid #fff;
    padding:4px 10px;
    font-size:14px;
    letter-spacing:1px;
    margin-bottom:10px;
}

/* LIVE MONITOR PANEL */
.livePanel{
    width:100%;
}

.liveRow{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:6px 0;
}

.liveLabel{
    font-size:14px;
    color:#aaa;
}

.liveValue{
    font-size:16px;
    font-weight:bold;
}

.statusDot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    margin-right:6px;
    background:#555;
}

.statusDot.online{
    background:#3ddc4a;
}

.statusDot.offline{
    background:#d9483b;
}

.liveNote{
    font-size:12px;
    color:#777;
    margin-top:10px;
    line-height:1.4;
}
</style>
</head>

<body>

<!-- HOME PAGE -->
<div id="home" class="page active" style="justify-content:center;">
    <h1>Sensor Monitor</h1>

    <button onclick="showPage('registerPage'); resetRegisterForm();">REGISTER</button>
    <button onclick="showPage('checkPage'); loadSavedData();">CHECK</button>
</div>

<!-- REGISTER PAGE -->
<div id="registerPage" class="page">

    <h1>REGISTER ITEM</h1>

    <input type="text" id="itemName" placeholder="Enter Name">

    <input type="text" id="itemDeviceId" placeholder="Device ID (e.g. A1B2C3)">

    <input type="password" id="itemDevicePassword" placeholder="Device Password">

    <div class="photo-input-wrap">
        <label class="photo-btn" for="itemPhoto" id="photoBtnLabel">ADD PHOTO</label>
        <input type="file" id="itemPhoto" accept="image/*" onchange="previewPhoto(event)">
    </div>

    <img id="photoPreview" alt="Photo preview">

    <button onclick="registerItem()">REGISTER</button>

    <button onclick="showPage('home')">HOME</button>

</div>

<!-- CHECK PAGE -->
<div id="checkPage" class="page">

    <h1>REGISTERED ITEMS</h1>

    <div class="card">

        <div class="itemId" id="displayID">None</div>

        <div id="cardPhotoWrap">
            <img id="cardPhoto" alt="Item photo">
            <div class="noPhoto" id="noPhoto">No Photo</div>
        </div>

        <div class="small">Name</div>
        <div id="displayName" class="data">---</div>

        <hr>

        <div class="livePanel" id="livePanel">
            <div class="liveRow">
                <span class="liveLabel"><span class="statusDot" id="statusDot"></span>Status</span>
                <span class="liveValue" id="liveStatus">No device linked</span>
            </div>
            <div class="liveRow">
                <span class="liveLabel">Humidity</span>
                <span class="liveValue" id="liveHumidity">--</span>
            </div>
            <div class="liveRow">
                <span class="liveLabel">Humidifier</span>
                <span class="liveValue" id="liveHumidifier">--</span>
            </div>
            <div class="liveRow">
                <span class="liveLabel">Fan</span>
                <span class="liveValue" id="liveFan">--</span>
            </div>
            <div class="liveNote" id="liveNote"></div>
        </div>

    </div>

    <div>
        <button onclick="previousDevice()">PREVIOUS</button>
        <button onclick="nextDevice()">NEXT</button>
    </div>

    <button class="dangerButton" onclick="deleteCurrentItem()">DELETE ITEM</button>

    <button onclick="showPage('home'); stopLiveMonitor();">HOME</button>

</div>

<script>
function showPage(id){
    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

let items = JSON.parse(localStorage.getItem("registeredItems")) || [];
let currentIndex = 0;
let currentPhotoDataUrl = null;

/* ---------- REGISTER PAGE ---------- */

function resetRegisterForm(){
    document.getElementById("itemName").value = "";
    document.getElementById("itemDeviceId").value = "";
    document.getElementById("itemDevicePassword").value = "";
    document.getElementById("itemPhoto").value = "";
    document.getElementById("photoPreview").style.display = "none";
    document.getElementById("photoPreview").src = "";
    document.getElementById("photoBtnLabel").textContent = "ADD PHOTO";
    currentPhotoDataUrl = null;
}

function previewPhoto(event){
    const file = event.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(e){
        currentPhotoDataUrl = e.target.result;
        const preview = document.getElementById("photoPreview");
        preview.src = currentPhotoDataUrl;
        preview.style.display = "block";
        document.getElementById("photoBtnLabel").textContent = "CHANGE PHOTO";
    };
    reader.readAsDataURL(file);
}

function generateItemId(){
    // Auto-assigned, sequential, zero-padded ID for this webapp's own item list, e.g. ITM-0001.
    // This is separate from the ESP32's own Device ID entered below.
    const nextNumber = items.length + 1;
    return "ITM-" + String(nextNumber).padStart(4, "0");
}

function registerItem(){
    const name = document.getElementById("itemName").value.trim();
    const deviceId = document.getElementById("itemDeviceId").value.trim();
    const devicePassword = document.getElementById("itemDevicePassword").value;

    if(name === ""){
        alert("Enter a name for this item.");
        return;
    }

    const newItem = {
        id: generateItemId(),
        name: name,
        deviceId: deviceId || null,               // e.g. "A1B2C3", shown on the device's LCD/setup page
        devicePassword: devicePassword || null,    // the password set on that device during WiFi setup
        photo: currentPhotoDataUrl                 // may be null if no photo added
    };

    items.push(newItem);
    localStorage.setItem("registeredItems", JSON.stringify(items));

    alert("Item Registered: " + newItem.id);

    resetRegisterForm();
    showPage("home");
}

/* ---------- CHECK PAGE ---------- */

function loadSavedData(){
    items = JSON.parse(localStorage.getItem("registeredItems")) || [];

    if(items.length === 0){
        document.getElementById("displayID").innerHTML = "No Items";
        document.getElementById("displayName").innerHTML = "---";
        document.getElementById("cardPhoto").style.display = "none";
        document.getElementById("noPhoto").style.display = "flex";
        setLiveUI("none", null, null, null, "");
        return;
    }

    currentIndex = 0;
    displayCurrentDevice();
}

function displayCurrentDevice(){
    const item = items[currentIndex];

    document.getElementById("displayID").innerHTML = item.id;
    document.getElementById("displayName").innerHTML = item.name;

    const cardPhoto = document.getElementById("cardPhoto");
    const noPhoto = document.getElementById("noPhoto");

    if(item.photo){
        cardPhoto.src = item.photo;
        cardPhoto.style.display = "block";
        noPhoto.style.display = "none";
    } else {
        cardPhoto.style.display = "none";
        noPhoto.style.display = "flex";
    }

    startLiveMonitor(item);
}

function nextDevice(){
    if(items.length === 0) return;

    currentIndex++;
    if(currentIndex >= items.length) currentIndex = 0;

    displayCurrentDevice();
}

function previousDevice(){
    if(items.length === 0) return;

    currentIndex--;
    if(currentIndex < 0) currentIndex = items.length - 1;

    displayCurrentDevice();
}

function deleteCurrentItem(){
    if(items.length === 0) return;

    const item = items[currentIndex];
    const confirmed = confirm("Delete \"" + item.name + "\" (" + item.id + ")? This cannot be undone.");
    if(!confirmed) return;

    stopLiveMonitor();

    items.splice(currentIndex, 1);
    localStorage.setItem("registeredItems", JSON.stringify(items));

    if(items.length === 0){
        currentIndex = 0;
        document.getElementById("displayID").innerHTML = "No Items";
        document.getElementById("displayName").innerHTML = "---";
        document.getElementById("cardPhoto").style.display = "none";
        document.getElementById("noPhoto").style.display = "flex";
        setLiveUI("none", null, null, null, "");
        return;
    }

    if(currentIndex >= items.length) currentIndex = items.length - 1;
    displayCurrentDevice();
}

/* ---------- LIVE MONITORING (polls the ESP32's /api/data) ---------- */

let livePollTimer = null;
const LIVE_POLL_INTERVAL_MS = 3000;
const LIVE_FETCH_TIMEOUT_MS = 4000;

function setLiveUI(state, humidity, humidifierOn, fanOn, note){
    const dot = document.getElementById("statusDot");
    const status = document.getElementById("liveStatus");

    dot.classList.remove("online", "offline");
    if(state === "online") dot.classList.add("online");
    if(state === "offline") dot.classList.add("offline");

    status.textContent =
        state === "online" ? "Online" :
        state === "offline" ? "Offline" :
        state === "checking" ? "Checking..." :
        "No device linked";

    document.getElementById("liveHumidity").textContent = humidity != null ? humidity + " %" : "--";
    document.getElementById("liveHumidifier").textContent = humidifierOn === true ? "ON" : humidifierOn === false ? "OFF" : "--";
    document.getElementById("liveFan").textContent = fanOn === true ? "ON" : fanOn === false ? "OFF" : "--";
    document.getElementById("liveNote").textContent = note || "";
}

async function pollLiveData(item){
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), LIVE_FETCH_TIMEOUT_MS);

    try{
        const host = "esp32-" + item.deviceId.toLowerCase() + ".local";
        const url = "http://" + host + "/api/data";

        const headers = {};
        if(item.devicePassword){
            headers["Authorization"] = "Basic " + btoa("admin:" + item.devicePassword);
        }

        const response = await fetch(url, { signal: controller.signal, mode: "cors", headers: headers });
        clearTimeout(timeout);

        if(response.status === 401){
            setLiveUI("offline", null, null, null, "Incorrect Device ID or password.");
            return;
        }

        if(!response.ok) throw new Error("bad response");

        const data = await response.json();

        setLiveUI(
            "online",
            data.humidityValid ? data.humidity : null,
            data.humidifierOn,
            data.fanOn,
            data.apMode ? "Device is in WiFi setup mode." : ""
        );
    }catch(err){
        clearTimeout(timeout);
        setLiveUI("offline", null, null, null,
            "Can't reach the device. Check the Device ID is correct, the device is on the same network, and - if this page is hosted on claude.ai - open the downloaded file directly instead, since the hosted version can't reach local devices.");
    }
}

function startLiveMonitor(item){
    stopLiveMonitor();

    if(!item.deviceId){
        setLiveUI("none", null, null, null, "Add a Device ID (and password) when registering this item to see live data.");
        return;
    }

    setLiveUI("checking", null, null, null, "");
    pollLiveData(item);
    livePollTimer = setInterval(() => pollLiveData(item), LIVE_POLL_INTERVAL_MS);
}

function stopLiveMonitor(){
    if(livePollTimer){
        clearInterval(livePollTimer);
        livePollTimer = null;
    }
}
</script>

</body>
</html>
